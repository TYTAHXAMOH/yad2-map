<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Выбор области поиска Yad2</title>
  
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Leaflet-Geoman -->
  <link rel="stylesheet" href="https://unpkg.com/@geoman-io/leaflet-geoman-free@latest/dist/leaflet-geoman.css" />
  <script src="https://unpkg.com/@geoman-io/leaflet-geoman-free@latest/dist/leaflet-geoman.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--tg-theme-bg-color, #18181b);
      color: var(--tg-theme-text-color, #ffffff);
    }
    #map {
      width: 100%;
      height: 100%;
    }
    .top-hint {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: rgba(24, 24, 27, 0.92);
      backdrop-filter: blur(8px);
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.2);
      pointer-events: none;
      white-space: nowrap;
      text-align: center;
    }
    .status-modal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(6px);
      z-index: 2000;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .status-card {
      background: #27272a;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 20px;
      padding: 24px;
      max-width: 360px;
      width: 100%;
      box-shadow: 0 12px 32px rgba(0,0,0,0.6);
    }
    .status-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 12px;
    }
    .status-desc {
      font-size: 14px;
      color: #a1a1aa;
      line-height: 1.5;
      margin-bottom: 20px;
    }
    .primary-btn {
      width: 100%;
      height: 48px;
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .primary-btn:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <div class="top-hint" id="top-hint">
    Нажмите ⬡ слева и нарисуйте область
  </div>

  <div id="map"></div>

  <!-- Модальное окно успешного сохранения -->
  <div class="status-modal" id="status-modal">
    <div class="status-card">
      <div style="font-size: 44px; margin-bottom: 12px;">✅</div>
      <div class="status-title">Область готова!</div>
      <div class="status-desc" id="status-desc">
        Данные отправлены боту. Если окно не закрылось, нажмите кнопку ниже:
      </div>
      <button class="primary-btn" id="close-btn">
        Закрыть карту
      </button>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      // Выключаем закрытие свайпом вниз, чтобы рисовать было удобно
      if (tg.enableClosingConfirmation) tg.enableClosingConfirmation();
    }

    // Извлечение существующих данных из URL (для режима редактирования)
    function getExistingGeoJSON() {
      try {
        const urlParams = new URLSearchParams(window.location.search);
        let dataParam = urlParams.get('data');
        if (!dataParam && window.location.hash) {
          const hashStr = window.location.hash.substring(1);
          const hashParams = new URLSearchParams(hashStr);
          dataParam = hashParams.get('data');
        }
        if (dataParam) {
          return JSON.parse(decodeURIComponent(dataParam));
        }
      } catch (e) {
        console.error("Ошибка парсинга геометрии:", e);
      }
      return null;
    }

    // Инициализация карты
    const map = L.map('map', {
      zoomControl: false
    }).setView([32.0853, 34.7818], 13);

    L.control.zoom({ position: 'topright' }).addTo(map);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    // Панель Geoman
    map.pm.addControls({
      position: 'topleft',
      drawPolygon: true,
      drawCircle: true,
      drawRectangle: true,
      drawMarker: false,
      drawCircleMarker: false,
      drawPolyline: false,
      editMode: true,
      dragMode: true,
      cutPolygon: false,
      removalMode: true
    });

    map.pm.setLang('ru');

    const topHint = document.getElementById('top-hint');
    const statusModal = document.getElementById('status-modal');
    const closeBtn = document.getElementById('close-btn');

    // Функция сборки GeoJSON со всех нарисованных слоев
    function getCombinedGeoJSON() {
      const layers = map.pm.getGeomanLayers();
      if (!layers || layers.length === 0) return null;

      const featureCollection = {
        type: "FeatureCollection",
        features: []
      };

      layers.forEach(layer => {
        if (layer.toGeoJSON) {
          featureCollection.features.push(layer.toGeoJSON());
        }
      });
      return JSON.stringify(featureCollection);
    }

    // Главная функция отправки данных боту
    function sendDataToTelegramBot() {
      const jsonStr = getCombinedGeoJSON();
      if (!jsonStr) {
        alert("Сначала нарисуйте хотя бы одну область на карте (кнопка ⬡ слева)");
        return;
      }

      topHint.innerText = "⏳ Сохранение...";

      // Страховка: копируем в буфер обмена
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(jsonStr).catch(() => {});
      }

      let sentDirectly = false;
      if (tg) {
        try {
          if (typeof tg.sendData === 'function') {
            tg.sendData(jsonStr);
            sentDirectly = true;
          }
        } catch (err) {
          console.error("tg.sendData failed:", err);
        }
      }

      if (sentDirectly) {
        // Если отправлено через нативный Telegram API, закрываем окно
        setTimeout(() => {
          if (tg && tg.close) tg.close();
        }, 150);
      } else {
        // Показываем подтверждение на случай внешнего браузера
        statusModal.style.display = "flex";
      }
    }

    closeBtn.addEventListener('click', () => {
      if (tg && tg.close) tg.close();
      statusModal.style.display = "none";
    });

    // Обновление состояния и кнопки сохранения
    function updateState() {
      const layers = map.pm.getGeomanLayers();
      const count = layers.length;

      if (count > 0) {
        topHint.innerHTML = `Выделено зон: <b>${count}</b>. Нажмите кнопку сохранения`;

        if (tg && tg.MainButton) {
          tg.MainButton.setText(`✅ СОХРАНИТЬ ОБЛАСТЬ (${count})`);
          tg.MainButton.setParams({
            color: '#2563eb',
            text_color: '#ffffff',
            is_active: true,
            is_visible: true
          });
          tg.MainButton.show();
          tg.MainButton.enable();
          tg.MainButton.offClick(sendDataToTelegramBot);
          tg.MainButton.onClick(sendDataToTelegramBot);
        }
      } else {
        topHint.innerText = "Нажмите ⬡ слева и нарисуйте область";
        if (tg && tg.MainButton) {
          tg.MainButton.hide();
        }
      }
    }

    map.on('pm:create', (e) => {
      if (e.layer && e.layer.pm) {
        e.layer.pm.enable();
      }
      updateState();
    });
    map.on('pm:remove', updateState);
    map.on('pm:dragend', updateState);
    map.on('pm:edit', updateState);

    // Загрузка существующей геометрии при редактировании
    const existing = getExistingGeoJSON();
    if (existing) {
      try {
        const geoLayer = L.geoJSON(existing, {
          style: {
            color: '#2563eb',
            fillColor: '#3b82f6',
            fillOpacity: 0.35,
            weight: 3
          }
        }).addTo(map);

        geoLayer.eachLayer(l => {
          if (l.pm) {
            l.pm.enable();
          }
        });

        const bounds = geoLayer.getBounds();
        if (bounds.isValid()) {
          map.fitBounds(bounds, { padding: [40, 40] });
        }
        topHint.innerHTML = "✏️ <b>Редактирование:</b> перемещайте вершины или добавьте новую область";
        updateState();
      } catch (err) {
        console.error("Ошибка отрисовки сохраненной области:", err);
      }
    } else {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          pos => {
            map.setView([pos.coords.latitude, pos.coords.longitude], 14);
          },
          () => {}
        );
      }
    }
  </script>
</body>
</html>
